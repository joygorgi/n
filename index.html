<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nadia Alexandria</title>
  <link rel="icon" href="images/n1.png" type="image/png">
  <script src="https://cdn.tailwindcss.com"></script>

  <!--font style -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mr+Dafoe&display=swap" rel="stylesheet">


  <style>
    /* === Page Background & Blur Transition === */
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background-color: #efeae7; /* fallback color while image loads */
    }

    /* Blur-up placeholder before main image loads */
    body {
      background-image: url('background1.svg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      filter: blur(5px);
      transition: filter 0.5s ease-in-out;
    }

    /* Once main image is loaded, remove blur */
    body.loaded {
      background-image: url('images/background1.svg'), url('images/background1.png');
      filter: blur(0);
    }

    /* === Animated background blobs === */
    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.6;
      animation: moveBlobs 20s infinite ease-in-out alternate;
    }

    .blob1 { background: #a5d8f3; width: 400px; height: 400px; top: -100px; left: -100px; animation-delay: 0s; }
    .blob2 { background: #82b9d8; width: 300px; height: 300px; bottom: 0; right: -100px; animation-delay: 5s; }
    .blob3 { background: #b7e2f1; width: 350px; height: 350px; top: 50%; left: 50%; animation-delay: 10s; }

    .blob {
      overflow-x: hidden;
    }


    @keyframes moveBlobs {
      0%   { transform: translate(0, 0) scale(1); }
      50%  { transform: translate(50px, -50px) scale(1.1); }
      100% { transform: translate(-30px, 40px) scale(1); }
    }

    /* === Fade-in animation === */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .fade-in { animation: fadeInUp 1s ease-in-out forwards; }
    
    .mr-dafoe-regular {
      font-family: "Mr Dafoe", cursive;
      text-shadow: 0 1px 3px rgba(0,0,0,0.15);
    }

    @media (max-width: 480px) {
      .blur-bg {
        backdrop-filter: blur(10px) !important;
      }
    }


    html, body {
      overflow-x: hidden;
    }
  </style>
</head>

<body class="relative min-h-screen flex items-center justify-center overflow-y-auto bg-[#eaf2f5]">

  <!-- Moving Blobs -->
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>
  <div class="blob blob3"></div>

  <!-- Main Card -->
  <div class="fade-in relative z-10 bg-white/20 backdrop-blur-lg p-8 rounded-3xl shadow-2xl w-full max-w-sm text-center space-y-6 border border-white/40 transition-transform duration-500 hover:scale-[1.02] hover:shadow-3xl">
    <img src="images/nadia1.jpg" alt="Profile Picture"
         class="w-24 h-24 mx-auto rounded-full shadow-lg object-cover ring-4 ring-[#a7cbdc]/50 hover:ring-[#68a3c1]/80 transition"/>

    <div>
      <h1 class="mr-dafoe-regular text-4xl text-gray-900" id="username">Nadia Alexandria</h1>
      <p class="text-gray-600 text-sm" id="tagline">Social Media</p>
    </div>

    <div class="space-y-4" id="links"></div>
  </div>

  <script>
    // Add "loaded" class to body when the page finishes loading
    window.addEventListener('load', () => {
      document.body.classList.add('loaded');
    });

    const profile = {
      username: "Nadia Alexandria",
      tagline: "Social Media",
      links: [
        { name: "YouTube", url: "https://www.youtube.com/@nadialexandriaa", icon: "images/y5.png" },
        { name: "Instagram", url: "https://www.instagram.com/nadialexandriaa", icon: "images/insta.png" },
        { name: "Snap", url: "https://www.snapchat.com/add/lil.nadiah", icon: "images/snap.png" },
        { name: "TikTok", url: "https://www.tiktok.com/@llil.nadiaa", icon: "images/tik.png" },
        { name: "Discord", url: "https://discord.gg/sENZTTjAU3", icon: "images/dog.webp" },
        { name: "Amazon", url: "https://www.amazon.com/shop/nadialexandriaa", icon: "images/amazon (1).png" },
      ]
    };

    document.getElementById("username").innerText = profile.username;
    document.getElementById("tagline").innerText = profile.tagline;

    const container = document.getElementById("links");
    profile.links.forEach(link => {
      const a = document.createElement("a");
      a.href = link.url;
      a.target = "_blank";
      a.className =
        "relative flex items-center justify-center bg-[#68a3c1] text-white px-4 py-3 rounded-xl font-medium hover:bg-[#5b93af] hover:scale-[1.03] transition-all duration-200 shadow-sm hover:shadow-md";
      a.innerHTML = `<img src="${link.icon}" alt="" class="absolute left-4 w-5 h-5" /> <span>${link.name}</span>`;
      container.appendChild(a);
    });
  </script>
</body>
</html>
